name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Changelog fragments (agbossjs/agboss#981): a PR adds changes/<issue>-<slug>.md; only a release PR (branch
  # release/<version>) edits CHANGELOG.md, where scripts/changelog-assemble.mjs folds the fragments in.
  changelog-fragments:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/changelog-assemble.mjs --check
      - name: CHANGELOG.md is edited only by a release PR
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$HEAD_REF" in release/*) echo "release PR: CHANGELOG.md may change"; exit 0 ;; esac
          if git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::Do not edit CHANGELOG.md in a PR: add a fragment changes/<issue>-<slug>.md instead (see changes/README.md). Only a release PR (branch release/<version>) edits it."
            exit 1
          fi

  check:
    name: check (Redis 7 durable primary, @agboss/core at the pinned SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # a durable primary (the stores' required settings), one with the defaults and a replica of
      # the durable one (the start checks must refuse both); the integration tests fail in CI
      # without them, never skip
      AGBOSS_REDIS_TEST_URL: redis://localhost:6379
      AGBOSS_REDIS_WEAK_TEST_URL: redis://localhost:6380
      AGBOSS_REDIS_REPLICA_TEST_URL: redis://localhost:6381
      AGBOSS_REDIS_CRASH_CONTAINER: redis-durable
    steps:
      - uses: actions/checkout@v4

      # a service container cannot take a command (--appendonly yes): the servers start here,
      # booting while the install runs; the crash test kills and restarts redis-durable itself
      - name: Start Redis 7 (durable on 6379, defaults on 6380, a replica on 6381)
        run: |
          docker network create redis-net
          docker run -d --name redis-durable --network redis-net -p 6379:6379 redis:7 \
            redis-server --appendonly yes --appendfsync always --no-appendfsync-on-rewrite no \
            --maxmemory-policy noeviction
          docker run -d --name redis-weak -p 6380:6379 redis:7
          docker run -d --name redis-replica --network redis-net -p 6381:6379 redis:7 \
            redis-server --replicaof redis-durable 6379 --appendonly yes --appendfsync always

      - name: Resolve the pinned framework SHA
        id: pin
        run: echo "sha=$(node -p "require('./.agboss-version.json').frameworkSha")" >> "$GITHUB_OUTPUT"

      - name: Check out agbossjs/agboss at the pinned SHA
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.sha }}
          path: .agboss-source

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Pack @agboss/core at the pinned SHA and install the tarball
        env:
          AGBOSS_REPO_DIR: .agboss-source
        run: |
          npm run pack:framework
          npm run install:packed

      - name: Wait for Redis
        run: |
          for server in redis-durable redis-weak redis-replica; do
            for attempt in $(seq 1 60); do
              [ "$(docker exec "$server" redis-cli ping)" = "PONG" ] && break
              sleep 1
            done
          done
          docker exec redis-durable redis-cli config get appendfsync
          docker exec redis-replica redis-cli info replication | grep role

      - name: Check (format, suppressions, installs, types, lint, tests with coverage, API report)
        run: npm run check

      - name: The crash test (kills redis-durable with SIGKILL and starts it again)
        run: npm run test:crash

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| | % |\n|---|---|\n'+['lines','branches','functions','statements'].map(k=>'| '+k+' | '+t[k].pct+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi

  faults:
    name: faults ${{ matrix.shard }}/2 (the fault suite, the Redis queue and rate limits beside SQLite fencing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      AGBOSS_REDIS_TEST_URL: redis://localhost:6379
      AGBOSS_FAULT_SHARD: ${{ matrix.shard }}/2
    steps:
      - uses: actions/checkout@v4

      - name: Start Redis 7 (a durable primary)
        run: |
          docker run -d --name redis-durable -p 6379:6379 redis:7 \
            redis-server --appendonly yes --appendfsync always --no-appendfsync-on-rewrite no \
            --maxmemory-policy noeviction

      - name: Resolve the pinned framework SHA
        id: pin
        run: echo "sha=$(node -p "require('./.agboss-version.json').frameworkSha")" >> "$GITHUB_OUTPUT"

      - name: Check out agbossjs/agboss at the pinned SHA
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.sha }}
          path: .agboss-source

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Pack @agboss/core at the pinned SHA and install the tarball
        env:
          AGBOSS_REPO_DIR: .agboss-source
        run: |
          npm run pack:framework
          npm run install:packed

      - name: Wait for Redis
        run: |
          for attempt in $(seq 1 60); do
            [ "$(docker exec redis-durable redis-cli ping)" = "PONG" ] && break
            sleep 1
          done

      - name: The fault suite
        run: npm run test:faults
