name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (Redis 7 with appendonly + appendfsync always, @agboss/core at the pinned SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # a durable Redis (the stores' required settings) and one with the defaults (the start check
      # must refuse it); the integration tests fail in CI without them, never skip
      AGBOSS_REDIS_TEST_URL: redis://localhost:6379
      AGBOSS_REDIS_WEAK_TEST_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@v4

      # a service container cannot take a command (--appendonly yes): the servers start here,
      # booting while the install runs
      - name: Start Redis 7 (durable on 6379, defaults on 6380)
        run: |
          docker run -d --name redis-durable -p 6379:6379 redis:7 redis-server --appendonly yes --appendfsync always
          docker run -d --name redis-weak -p 6380:6379 redis:7

      - name: Resolve the pinned framework SHA
        id: pin
        run: echo "sha=$(node -p "require('./.agboss-version.json').frameworkSha")" >> "$GITHUB_OUTPUT"

      - name: Check out agbossjs/agboss at the pinned SHA
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.sha }}
          path: .agboss-source

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Pack @agboss/core at the pinned SHA and install the tarball
        env:
          AGBOSS_REPO_DIR: .agboss-source
        run: |
          npm run pack:framework
          npm run install:packed

      - name: Wait for Redis
        run: |
          for server in redis-durable redis-weak; do
            for attempt in $(seq 1 60); do
              [ "$(docker exec "$server" redis-cli ping)" = "PONG" ] && break
              sleep 1
            done
          done
          docker exec redis-durable redis-cli config get appendfsync

      - name: Check (format, suppressions, installs, lint, types, tests with coverage, API report)
        run: npm run check

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| | % |\n|---|---|\n'+['lines','branches','functions','statements'].map(k=>'| '+k+' | '+t[k].pct+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi
