name: Mutation (nightly, cold)

# agbossjs/agboss#1213, as the core's mutation-nightly.yml: every shard of
# scripts/mutation-shards.mjs with no cached results (`--force`), so a mutant an incremental run
# kept as killed is tested again against today's tests.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: mutation ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [leases, queue-and-limits, connection]
    env:
      MUTATION_SHARD: ${{ matrix.shard }}
      AGBOSS_REDIS_TEST_URL: redis://localhost:6379
      AGBOSS_REDIS_WEAK_TEST_URL: redis://localhost:6380
      AGBOSS_REDIS_REPLICA_TEST_URL: redis://localhost:6381
    steps:
      - uses: actions/checkout@v4

      - name: Start Redis 7 (durable on 6379, defaults on 6380, a replica on 6381)
        run: |
          docker network create redis-net
          docker run -d --name redis-durable --network redis-net -p 6379:6379 redis:7 \
            redis-server --appendonly yes --appendfsync always --no-appendfsync-on-rewrite no \
            --maxmemory-policy noeviction
          docker run -d --name redis-weak -p 6380:6379 redis:7
          docker run -d --name redis-replica --network redis-net -p 6381:6379 redis:7 \
            redis-server --replicaof redis-durable 6379 --appendonly yes --appendfsync always

      - name: Resolve the pinned framework SHA
        id: pin
        run: echo "sha=$(node -p "require('./.agboss-version.json').frameworkSha")" >> "$GITHUB_OUTPUT"

      - name: Check out agbossjs/agboss at the pinned SHA
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.sha }}
          path: .agboss-source

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Pack @agboss/core at the pinned SHA and install the tarball
        env:
          AGBOSS_REPO_DIR: .agboss-source
        run: |
          npm run pack:framework
          npm run install:packed

      # a test's child process (tests/support/queue-save.child.mjs) imports the built package
      - name: Build
        run: npm run build

      - name: Wait for Redis
        run: |
          for server in redis-durable redis-weak redis-replica; do
            for attempt in $(seq 1 60); do
              [ "$(docker exec "$server" redis-cli ping)" = "PONG" ] && break
              sleep 1
            done
          done

      - name: Mutation testing of the shard, every mutant (break below 100 % killed or justified)
        run: npm run test:mutation -- --force
      # agbossjs/agboss#1367: a Timeout counts as killed, and a survivor whose run outlasts Stryker's limit reads
      # as one: each shard's timeoutMS is above its whole run (scripts/mutation-shards.mjs), so a Timeout left
      # must be a proven hang (scripts/stryker-proven-hangs.json); one that is not listed is run again alone
      # (agbossjs/mongodb#103: a loaded runner moves it between mutants), in a fresh Stryker process
      - name: No Timeout that is not a proven hang (agbossjs/agboss#1367)
        run: node scripts/stryker-timeouts.mjs --rerun reports/mutation/${{ matrix.shard }}.json

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.shard }}
          path: reports/mutation/
